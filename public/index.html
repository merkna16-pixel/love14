<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5b6aa">
  <title>Love App — Якуб и Соня</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-art" aria-label="Love App">
      <div class="sun-stamp">Y + S</div>
      <p class="eyebrow">PRIVATE SPACE / 01</p>
      <h1>Love<br><em>App</em></h1>
      <p class="login-note">Маленькая вселенная для ваших больших «мы».</p>
      <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
    </section>
    <section class="login-panel">
      <div>
        <p class="eyebrow">Добро пожаловать домой</p>
        <h2>Кто сегодня<br>на связи?</h2>
      </div>
      <form id="loginForm" class="login-form">
        <label>Имя <input id="loginInput" autocomplete="username" placeholder="Якуб или Соня" required></label>
        <label>Пароль <input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••" required></label>
        <button class="button button-dark" type="submit">Войти в наше пространство <span>↗</span></button>
        <p id="loginError" class="form-error" role="alert"></p>
      </form>
      <p class="login-footer">Только для двоих · приватная территория</p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
